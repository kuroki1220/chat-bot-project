<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社内チャットボット</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="loading.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="assets/slim-logo.png" alt="SLIM 社内用Chatbot" class="header-logo">
        </div>
        <div class="chat-messages" id="chat-messages">
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="質問を入力してください..." autofocus>
            <button id="send-button">送信</button>
        </div>
        <div class="site-banner-area">
            <a href="https://www.slim-j.net/" target="_blank" rel="noopener noreferrer" class="site-banner">
                <img src="assets/banner-slimhikari.png" alt="スリム光">
            </a>

            <a href="https://hikari-support.ne.jp/" target="_blank" rel="noopener noreferrer" class="site-banner">
                <img src="assets/banner-support.png" alt="光サポート">
            </a>

            <a href="https://office-phone.site/" target="_blank" rel="noopener noreferrer" class="site-banner">
                <img src="assets/banner-office.png" alt="オフィス見積ナビ">
            </a>

            <a href="https://slimnet.biz/" target="_blank" rel="noopener noreferrer" class="site-banner">
                <img src="assets/banner-cloudlink.png" alt="Slim Cloud Link">
            </a>
        </div>
    </div>
    <script src="script_v2.js?v=20260707_15"></script>
</body>
</html>
